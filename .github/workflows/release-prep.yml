# Release prep (stage 1 of 2).
#
# Human-triggered. Computes the next version with commitizen (from the
# Conventional-Commit history, or an explicit override), writes the version +
# CHANGELOG updates via `cz bump --files-only`, and opens a PR against the
# default branch. It does NOT commit to the default branch and does NOT tag:
# normal CI runs on the PR, a human reviews the generated changelog and the
# `gate-check@v<version>` pin, and the PR is squash-merged. Tagging happens in
# stage 2 (release-publish.yml) after the merge.
name: Release prep (stage 1)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version like 1.2.3; leave empty to auto-increment from commits'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cz derives the next version from the full commit + tag history.
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Preconditions - release gates and tests
        # Fail fast while any release blocker exists, BEFORE mutating anything.
        run: |
          set -euo pipefail
          bash scripts/grep_gates.sh --release
          python -m pytest tests/ -q
      - name: Bump, branch, and open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env (never inlined into run:) to avoid injection.
          VERSION_INPUT: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # `--files-only` updates .cz.toml + version_files and, with
          # `--changelog`, CHANGELOG.md -- WITHOUT committing or tagging. An
          # empty VERSION_INPUT lets cz auto-increment from the commit log.
          if [ -n "$VERSION_INPUT" ]; then
            cz bump --files-only --changelog --yes "$VERSION_INPUT"
          else
            cz bump --files-only --changelog --yes
          fi

          # The version is only known after the bump has rewritten .cz.toml.
          V="$(cz version --project)"
          BRANCH="release/v$V"

          git switch -c "$BRANCH"
          git commit -a -m "chore(release): v$V"

          # Push over an explicit token URL; persisted credentials are disabled.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "chore(release): v$V" \
            --body "Automated release prep generated by cz bump. Review the CHANGELOG.md entry and the version_files pin (gate-check@v$V in quiz-gate.yml) before squash-merging. Normal CI, human review, and squash-merge follow; this workflow does NOT tag -- run release-publish (stage 2) after merge."
