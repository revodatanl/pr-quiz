# Dogfood caller: this repo consumes its own reusable workflow the same way
# an adopter would (see templates/callers/quiz-generate.yml). Local `uses:`
# form so PR branches exercise their own copy of the reusable workflow.
name: quiz-generate

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]  # only main requires the quiz-gate status

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  quiz-generate:
    uses: ./.github/workflows/quiz-generate.yml
    with:
      # Repo variables override the defaults; `|| 'x'` keeps an unset variable
      # from overriding the reusable workflow's default with ''.
      app_name: ${{ vars.QUIZ_APP_NAME || 'pr-quiz' }}
      job_name: ${{ vars.QUIZ_JOB_NAME || 'pr-quiz-generator' }}
      status_context: ${{ vars.QUIZ_STATUS_CONTEXT || 'quiz-gate' }}
      waive_authors: ${{ vars.QUIZ_WAIVE_AUTHORS || 'dependabot[bot]' }}
      # `branches:` above only filters pull_request events; target_branch is
      # what stops /quiz comments generating quizzes for PRs into other branches.
      target_branch: ${{ vars.QUIZ_TARGET_BRANCH || 'main' }}
      # Extra generated paths beyond the built-in list and this repo's
      # .gitattributes linguist-generated entries; unset is the normal case.
      generated_globs: ${{ vars.QUIZ_GENERATED_GLOBS }}
    secrets:
      databricks_host: ${{ secrets.DATABRICKS_HOST }}
      databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
      databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
