name: CI

# Project CI for the pr-quiz repo itself (not the reusable quiz workflows).
# Runs the unit suite, lints and security-scans the workflows, and enforces
# repo-hygiene grep gates. The release-gate job runs only on tag pushes and
# enforces the pre-tag cleanup documented in RELEASING.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

# Least privilege: every job only reads the repo. No job here writes statuses,
# comments, or contents.
permissions:
  contents: read

jobs:
  test:
    name: pytest (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The suite tests pure logic; these are the only imports reached at
      # collection time (verified against a clean environment). No Spark,
      # databricks-sql, or network access is needed. pyyaml backs the
      # caller-template syntax guard (test_caller_templates.py). The exact
      # pins live in requirements-dev.txt.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned release binary (deterministic; no third-party action to trust).
      # The download is checksum-verified before extraction; bump the sha256
      # manually alongside ACTIONLINT_VERSION (from the release checksums file).
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      # shellcheck is disabled: the hand-hardened reusable workflows carry
      # shell scripts this repo does not own the freedom to reformat here, and
      # actionlint's own checks (syntax, expression contexts, action-ref
      # format, glob/permissions validity) are what this gate is for.
      - name: Run actionlint
        run: ./actionlint -shellcheck= -color

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor's own artipacked audit: a checkout that persists the token
          # is a credential-leak smell. This job needs no credentials.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install zizmor
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      # All workflows (reusable, dogfood callers, CI) plus the composite
      # action. Verified clean with zizmor 1.27.0 at the default persona. The
      # unpinned-uses policy in .github/zizmor.yml requires SHA pins for
      # third-party actions but allows this repo's own gate-check action to be
      # ref-pinned to its release tag (a self-referential SHA pin is
      # impossible). --offline keeps the run deterministic (the online-only
      # audits need a GitHub token and are skipped either way).
      - name: Scan workflows and actions
        run: zizmor --offline .github/workflows/ actions/

  grep-gates:
    name: repo-hygiene grep gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run always-on grep gates
        run: bash scripts/grep_gates.sh

  release-gate:
    name: release hygiene (tags only)
    # Only on tag pushes: enforces RELEASING.md preconditions. Expected to fail
    # on the current tree, which is why it is NOT part of the PR/push checks.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce tag-time grep gates
        run: bash scripts/grep_gates.sh --release
