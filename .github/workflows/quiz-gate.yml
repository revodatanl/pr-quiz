name: quiz-gate (reusable)

# Reusable workflow - not triggered directly. Call it from a thin caller
# workflow (copy templates/callers/quiz-gate.yml; this repo dogfoods via
# .github/workflows/caller-quiz-gate.yml). The caller owns the event triggers
# (issue_comment for /quiz-check, workflow_dispatch for manual re-evaluation)
# and must grant the permissions declared below. Inside this workflow,
# github.event.* is the CALLER's triggering event.

on:
  workflow_call:
    inputs:
      warehouse_id:
        description: Databricks SQL warehouse ID the gate query runs against.
        type: string
        required: true
      results_table:
        description: Fully qualified quiz_results table name.
        type: string
        default: workspace.pr_quiz.quiz_results
      status_context:
        description: Commit-status context used for the merge gate.
        type: string
        default: quiz-gate
      pr_number:
        description: >
          PR number to re-evaluate. Only used on workflow_dispatch - pass the
          caller's dispatch input through; comment events resolve the PR from
          the comment itself.
        type: string
        default: ''
      allowed_associations:
        description: >
          Author associations allowed to trigger a re-check via a /quiz-check
          comment. Comma-separated, uppercase, no spaces
          (e.g. "OWNER,MEMBER,COLLABORATOR").
        type: string
        default: OWNER,MEMBER,COLLABORATOR
      waive_authors:
        description: >
          Comma-separated PR author logins whose PRs bypass the quiz gate. Keep
          identical to the quiz-generate input of the same name: those PRs never
          produce a quiz result, so without this a /quiz-check would find no row
          and block the very PR quiz-generate waived.
        type: string
        default: dependabot[bot]
    secrets:
      databricks_host:
        description: Databricks workspace URL.
        required: true
      databricks_client_id:
        description: Service-principal OAuth client id.
        required: true
      databricks_client_secret:
        description: Service-principal OAuth client secret.
        required: true

# Required caller permissions (deliberately NOT declared here: a called
# workflow requesting more than the caller's token can grant fails the call
# instead of skipping cleanly, e.g. on events with a downgraded token):
#   pull-requests: read, statuses: write
# The caller templates carry exactly this block.

jobs:
  # /quiz-check is gated on comment author_association exactly like /quiz in
  # quiz-generate (padded-token match so e.g. NONE can never substring-match
  # into the allowed list) - on a public repo an ungated comment trigger is a
  # denial-of-wallet vector.
  gate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/quiz-check') &&
       contains(format(',{0},', inputs.allowed_associations),
                format(',{0},', github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Comment spam must not fan out parallel gate runs: one running + at most
    # one queued run per PR (older queued runs are superseded).
    concurrency:
      group: quiz-gate-${{ github.repository }}-${{ github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.databricks_host }}
      DATABRICKS_CLIENT_ID: ${{ secrets.databricks_client_id }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.databricks_client_secret }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # `required: true` only checks that the input is PROVIDED - a caller
      # wiring an unset repo variable passes '' straight through and dies
      # later with a cryptic Databricks error. Fail fast with the actual fix.
      - name: Validate warehouse_id input
        env:
          WAREHOUSE_ID: ${{ inputs.warehouse_id }}
        run: |
          if [ -z "$WAREHOUSE_ID" ]; then
            echo "::error::warehouse_id input is empty - set the QUIZ_WAREHOUSE_ID repo variable (or pass warehouse_id explicitly) in the caller workflow."
            exit 1
          fi

      - name: Install Databricks CLI
        # SHA-pinned (tags are mutable; a moved tag must not change what runs
        # on adopters' runners). Bump deliberately at release time.
        uses: databricks/setup-cli@903f2679e2ca728decb4a78c74d57570f8e8d2e5 # v1.12.1

      # Event-derived values go through env, never inline ${{ }} inside run
      # scripts (shell-injection hardening; same rule for every step).
      - name: Resolve PR head SHA and author
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          case "$EVENT_NAME" in
            issue_comment) pr=$ISSUE_NUMBER;;
            *)             pr=$PR_NUMBER_INPUT;;  # workflow_dispatch passthrough
          esac
          case "$pr" in
            ''|*[!0-9]*) echo "::error::pr_number must be a PR number, got '$pr'."; exit 1;;
          esac
          # REST, not `gh pr view --json author`: that spells a GitHub App author
          # "app/dependabot" where quiz-generate matches "dependabot[bot]".
          pr_json=$(gh api "repos/$REPO/pulls/$pr")
          sha=$(jq -r .head.sha <<<"$pr_json")
          author=$(jq -r .user.login <<<"$pr_json")
          echo "PR #$pr head=$sha author=$author"
          {
            echo "sha=$sha"
            echo "author=$author"
          } >> "$GITHUB_OUTPUT"

      # An allow-listed bot's PR never produces a quiz result, so the gate query
      # would find no row and block a PR quiz-generate already waived. Padded
      # match so a partial login cannot substring-match into the list.
      - name: Check whether the PR author is waived
        id: waive
        env:
          AUTHOR: ${{ steps.pr.outputs.author }}
          WAIVE_AUTHORS: ${{ inputs.waive_authors }}
        run: |
          if printf ',%s,' "$WAIVE_AUTHORS" | grep -qF ",$AUTHOR,"; then
            echo "waived=true" >> "$GITHUB_OUTPUT"
          else
            echo "waived=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate merge gate against quiz results
        id: gate
        if: steps.waive.outputs.waived != 'true'
        # Remote form on purpose: a `./actions/gate-check` path inside a
        # reusable workflow would resolve against the CALLER's repository and
        # break for every consumer. The remote form works for this repo's own
        # dogfood callers too.
        # Pinned to a version tag, never a moving branch: this ref resolves at
        # runtime independent of the consumer's @v1 workflow pin, so a moving
        # branch here would hand anyone who can push to this repo's default
        # branch control of every adopter's gate step - with the DATABRICKS_*
        # secrets in scope. `cz bump` (version_files in .cz.toml) rewrites this
        # pin in lock-step with each release tag, and the CI release-gate blocks
        # a tag whenever it is left unpinned.
        uses: revodatanl/pr-quiz/actions/gate-check@v1.0.0
        with:
          sha: ${{ steps.pr.outputs.sha }}
          repo: ${{ github.repository }}
          warehouse_id: ${{ inputs.warehouse_id }}
          results_table: ${{ inputs.results_table }}

      - name: Publish quiz-gate commit status
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.sha }}
          STATUS_CONTEXT: ${{ inputs.status_context }}
          PASSED: ${{ steps.gate.outputs.passed }}
          VERDICT: ${{ steps.gate.outputs.verdict }}
          WAIVED: ${{ steps.waive.outputs.waived }}
        run: |
          # An ERROR verdict is an infra/config failure, not a blocked gate
          # (gate_check.py prefixes it "ERROR:"); publish state=error to match
          # quiz-generate's error path rather than a plain failure.
          if [ "$WAIVED" = "true" ]; then
            state=success
            VERDICT="Quiz waived: automated dependency update"
          elif [ "$PASSED" = "true" ]; then
            state=success
          elif [ "${VERDICT#ERROR}" != "$VERDICT" ]; then
            state=error
          else
            state=failure
          fi
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$VERDICT"
          # Fail the run when the gate is not green (deliberate: a blocked
          # re-check should be loud). Trade-off: comment/dispatch runs report
          # against the DEFAULT-BRANCH head commit (GITHUB_SHA), so the
          # default branch's tip shows a red X until a newer commit lands.
          # The check never attaches to the PR head, so PR checks stay clean.
          [ "$state" = "success" ]
